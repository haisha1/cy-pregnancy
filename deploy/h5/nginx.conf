# H5 和小程序共用用户 Java 服务；管理 Web 仍使用独立的 18080 入口。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"status":"UP"}';
    }

    # Docker DNS 动态解析，允许用户后端晚启动或重建后 IP 改变。
    location ^~ /api/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $user_backend http://user-api:18731;
        proxy_pass $user_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
    }
    location = /api/v1 { return 404; }
    location ~ ^/(internal|admin|actuator|swagger-ui|v3/api-docs)(/|$) { return 404; }
    location ~ /\. { return 404; }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # 丢失的脚本、样式和图片应返回 404，不能用首页冒充资源。
    location ~* \.(js|css|map|json|png|jpe?g|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control no-store always;
        try_files $uri $uri/ /index.html;
    }
}
